name: Build Android APK & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies & build web bundle
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher icons for WhatApp
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || (sudo apt-get update && sudo apt-get install -y python3-pil)
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os

          src = Image.open("src/assets/images/whatapp_logo_1794610455639.jpg").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          fg_sizes = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }
          res_dir = "android/app/src/main/res"
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = src.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"))

              fg_px = fg_sizes[folder]
              fg_canvas = Image.new("RGBA", (fg_px, fg_px), (11, 20, 26, 255))
              inner_px = int(fg_px * 0.68)
              fg_icon = src.resize((inner_px, inner_px), Image.Resampling.LANCZOS)
              offset = (fg_px - inner_px) // 2
              fg_canvas.paste(fg_icon, (offset, offset), fg_icon)
              fg_canvas.save(os.path.join(out_dir, "ic_launcher_foreground.png"))

              mask = Image.new("L", (px, px), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, px - 1, px - 1), fill=255)
              round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, "ic_launcher_round.png"))
          PY

      - name: Inject Android camera, microphone, wake & call notification permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.USE_FULL_SCREEN_INTENT",
          ]
          missing_lines = [
              f'    <uses-permission android:name="{perm}" />'
              for perm in permissions
              if perm not in content
          ]
          if missing_lines:
              if "<application" not in content:
                  raise RuntimeError("<application tag not found in AndroidManifest.xml")
              content = content.replace(
                  "<application",
                  "\n".join(missing_lines) + "\n\n    <application",
                  1,
              )

          if "showWhenLocked" not in content and "<activity" in content:
              content = content.replace(
                  "<activity",
                  '<activity\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"',
                  1,
              )

          ET.fromstring(content)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-assets
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/WhatApp-${TAG}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatApp-${{ github.event.inputs.release_tag || github.ref_name }}-APK
          path: release-assets/WhatApp-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "WhatApp ${{ github.event.inputs.release_tag || github.ref_name }}"
          fail_on_unmatched_files: true
          body: |
            Rilis resmi APK Android **WhatApp** (Obrolan, Telepon & Video Call dengan Nomor Virtual Acak).
            - Login Akun Google dengan Nomor Virtual Acak otomatis
            - Enkripsi End-to-End pada setiap pesan dan panggilan
            - Panggilan Suara, Video Call, dan Manajemen Kontak Profil
          files: release-assets/WhatApp-*.apk
